name: pdr2
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: pdr2
      POSTGRES_DB: pdr2_dev
      POSTGRES_PASSWORD: ${PDR2_POSTGRES_PASSWORD:?Set PDR2_POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pdr2_pgdata:/var/lib/postgresql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pdr2 -d pdr2_dev']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pdr2_pgdata:
