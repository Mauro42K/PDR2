<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fa" />
    <meta name="description" content="Planificador local de proyectos PDR 2.0" />
    <link rel="icon" type="image/svg+xml" href="/pdr2-mark.svg" />
    <title>PDR 2.0</title>
    <script>
      try {
        var t = localStorage.getItem('pdr2-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
